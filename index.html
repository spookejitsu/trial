<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight Night Board — Live</title>
<style>
:root{--bg:#0a0b10;--fg:#fff;--mut:#8b90a0;--r:#e0262f;--b:#2a6df4;--pn:#151721;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#1b1e2e,#0a0b10 70%);color:var(--fg);font-family:system-ui,Arial,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:1vw;padding:1.2vh 2vw;border-bottom:1px solid #ffffff18}
header h1{font-size:clamp(14px,2.4vw,26px);margin:0;letter-spacing:.08em;text-transform:uppercase;flex:1}
header small{color:var(--mut);display:block;letter-spacing:0;font-weight:400;text-transform:none;font-size:.6em}
.seg{display:flex;border:1px solid #ffffff30;border-radius:99px;overflow:hidden}
.seg button,.btn{background:none;border:0;color:var(--fg);padding:.8vh 1.6vw;font-size:clamp(12px,1.6vw,16px);cursor:pointer;min-height:36px}
.seg button.on{background:var(--r);font-weight:700}
.btn{border:1px solid #ffffff30;border-radius:8px;background:#ffffff0d}
.btn.pri{background:var(--r);border-color:var(--r);font-weight:700}
main{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:1.5vh 2vw;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.tag{text-align:center;color:var(--mut);letter-spacing:.2em;text-transform:uppercase;font-size:clamp(11px,1.5vw,16px)}
.wc{text-align:center;font-weight:800;font-size:clamp(18px,3.2vw,36px);letter-spacing:.06em;text-transform:uppercase;margin:.3vh 0}
.tape{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(30%,36%) 1fr;align-items:end;gap:1vw}
.fighter{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0;position:relative}
.fighter.a{--c:var(--r)}.fighter.b{--c:var(--b)}
.fighter .ph{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 90%,color-mix(in srgb,var(--c) 45%,transparent),transparent 65%)}
.fighter img{max-height:100%;max-width:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 14px #000a)}
.nm{text-align:center;background:linear-gradient(transparent,#000a);width:100%;padding:.6vh 0;border-bottom:4px solid var(--c)}
.nm b{display:block;font-size:clamp(18px,3.4vw,40px);text-transform:uppercase;line-height:1.05}
.nm i{color:var(--mut);font-size:clamp(11px,1.6vw,18px)}
.fl{font-size:clamp(18px,2.6vw,30px)}
.stats{align-self:center;background:var(--pn);border:1px solid #ffffff14;border-radius:12px;padding:1vh 1vw}
.row{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;padding:.9vh 0;border-bottom:1px solid #ffffff10;font-size:clamp(14px,2.3vw,26px);font-weight:700;align-items:center}
.row:last-child{border:0}.row span{color:var(--mut);font-size:.5em;letter-spacing:.14em;text-transform:uppercase;padding:0 .8vw;font-weight:500}
.row .w{color:#6ee7a0}
.live{display:flex;justify-content:center;gap:2vw;align-items:center;margin:.4vh 0}
.pill{background:var(--r);padding:.3vh 1.2vw;border-radius:99px;font-weight:800;letter-spacing:.15em;font-size:clamp(11px,1.5vw,16px);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.55}}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(26px,5vw,60px);font-weight:800}
.rd{font-size:clamp(16px,2.6vw,30px);font-weight:700}
.banner{background:var(--r);text-align:center;font-weight:900;font-size:clamp(16px,3.2vw,38px);padding:1.4vh 1vw;border-radius:10px;margin:.6vh 0;text-transform:uppercase}
.next{text-align:center;font-size:clamp(16px,2.8vw,32px);color:var(--mut);padding:.8vh 0}.next b{color:var(--fg)}
.fighter.lose img{filter:grayscale(1) brightness(.5)}.fighter.win .nm{background:linear-gradient(transparent,#1b6b3d99)}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.8vh}
.bt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--pn);border-radius:10px;padding:.6vh 1.5vw;gap:1vw}
.bt .s{display:flex;align-items:center;gap:1vw;font-weight:700;font-size:clamp(13px,2.2vw,24px);text-transform:uppercase}
.bt .s:last-child{flex-direction:row-reverse;text-align:right}
.bt img{height:clamp(44px,9vh,90px);width:clamp(40px,7vw,80px);object-fit:contain;object-position:bottom}
.bt .m{text-align:center;color:var(--mut);font-size:clamp(10px,1.4vw,14px);letter-spacing:.1em;text-transform:uppercase}.bt .m b{color:var(--fg);display:block;font-size:1.2em}
.bt small{display:block;color:var(--mut);font-weight:400;font-size:.6em}
.bt.cur{outline:2px solid var(--r)}.bt.done{opacity:.55}
.hint{position:absolute;bottom:1vh;left:0;right:0;text-align:center;color:var(--mut);font-size:12px}
#panel,#evPanel{position:fixed;inset:0;background:#000d;display:none;z-index:9;overflow:auto;padding:3vh 3vw}
#panel.show,#evPanel.show{display:block}
.box{max-width:900px;margin:0 auto;background:var(--pn);border-radius:12px;padding:16px}
.box h2{margin:.2em 0 .5em;font-size:18px}
textarea,select,input{width:100%;background:#0006;color:#fff;border:1px solid #ffffff30;border-radius:8px;padding:8px;font-size:14px}
textarea{height:200px;font-family:monospace;font-size:12px}
.g{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.g>*{flex:1;min-width:110px}
.up{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:13px}.up input{width:auto;flex:1}
.fl img{height:1em;vertical-align:-.12em;border-radius:2px}#st{position:fixed;top:2px;left:8px;font-size:11px;color:#8b90a0}.silsvg{height:100%;max-width:70%}.silwrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.silwrap small{color:var(--mut);font-size:clamp(10px,1.4vw,14px);letter-spacing:.08em;padding:.4vh 0;text-align:center}
.z path,.z ellipse{fill:rgba(255,40,40,var(--o))}.z.hit path,.z.hit ellipse{animation:hit .6s 4}
@keyframes hit{0%,100%{fill:rgba(255,40,40,var(--o))}50%{fill:#ff2a2a;filter:drop-shadow(0 0 8px #f22)}}
.evb{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;font-size:15px}.evb small{color:#8b90a0}
.ph{position:relative}.fbg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.38;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}.ph img,.silwrap{position:relative;z-index:1}</style></head><body>
<div id="app">
<header><h1 id="ttl">Fight Night<small id="sub"></small></h1>
<div class="seg" id="modeSeg"><button data-m="auto">Auto</button><button data-m="week">Fight Week</button><button data-m="night">Fight Night</button></div>
<button class="btn" id="cardsBtn">📅 Cards</button><button class="btn" id="gear">⚙︎ Setup</button><button class="btn" id="fs">⛶</button></header>
<main id="main"></main>
</div>

<div id="panel"><div class="box">
<h2>Setup</h2>
<div class="g"><button class="btn" id="silBtn">Silhouette: On</button><select id="evSel"></select><button class="btn" id="rev">Reverse bout order</button><button class="btn pri" id="refresh">Refresh now</button></div>
<p id="info" style="font-size:13px;color:#8b90a0"></p>
<div class="g"><button class="btn pri" id="close">Done</button></div>
</div></div><div id="evPanel"><div class="box"><h2>Upcoming cards</h2><div id="evList"></div><div class="g"><button class="btn pri" id="evClose">Close</button></div></div></div><div id="st"></div>
<script>
const $=s=>document.querySelector(s);
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let bro=null,lastTouch=0,tx=null,PREV={},showSil=LS.g("fn_sil",true),mode=LS.g("fn_mode","auto"),rev=LS.g("fn_rev",false),evId=LS.g("fn_ev",null),EV=[],cur=null,slide=0,ATH=LS.g("fn_ath",{});
const BASE="https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard";
const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,"");
const last=n=>n.trim().split(" ").slice(-1)[0];
const sil=c=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'><path d='M100 20c-26 0-42 20-42 46 0 20 8 34 20 42-40 10-62 34-66 80l-2 112h180l-2-112c-4-46-26-70-66-80 12-8 20-22 20-42 0-26-16-46-42-46z' fill='${c}' opacity='.55'/></svg>`);
function fig(c,s){const a=c.athlete||{},id=a.id||c.id;const x=ATH[id]||{};
 return{id,name:a.displayName||a.fullName||"TBA",cc:a.flag?.alt||"",flag:a.flag?.href||"",rec:(c.records&&c.records[0]&&c.records[0].summary)||"-",
 img:id?`https://a.espncdn.com/i/headshots/mma/players/full/${id}.png`:(a.headshot?.href||""),alt:a.headshot?.href||"",age:x.age,ht:x.ht,reach:x.reach,stance:x.stance,win:c.winner,s,stats:(c.statistics||[]).map(t=>({n:String(t.name||t.abbreviation||t.displayName||"").toLowerCase(),v:parseFloat(t.value??t.displayValue)||0}))}}
function bout(co,ev){const cs=co.competitors||[];const A=cs.find(c=>c.order===1)||cs[0],B=cs.find(c=>c.order===2)||cs[1];if(!A||!B)return null;
 const st=co.status||{},t=st.type||{},r=st.result||{};
 return{id:co.id,date:co.date||co.startDate||ev.date,card:co.cardSegment?.description||co.cardSegment?.name||"Card",wc:(co.type?.text||co.type?.abbreviation||"")+(co.format?.regulation?.periods?` · ${co.format.regulation.periods} Rounds`:""),rounds:co.format?.regulation?.periods||3,
 state:t.state||"pre",done:!!t.completed,rd:st.period||1,clock:st.displayClock||"",method:r.shortDisplayName||r.displayName||t.detail||"",a:fig(A,"a"),b:fig(B,"b")}}
function parse(j){return(j.events||[]).sort((x,y)=>new Date(x.date)-new Date(y.date)).map(ev=>({id:ev.id,name:ev.shortName||ev.name,date:ev.date,bouts:(ev.competitions||[]).map(c=>bout(c,ev)).filter(Boolean)}))}
const zt=f=>{const z={head:0,body:0,leg:0};f.stats.forEach(t=>{if(/att|pct|acc|%/.test(t.n))return;for(const k in z)if(t.n.includes(k))z[k]+=t.v});return z};
function calcDmg(){EV.forEach(e=>e.bouts.forEach(b=>{[[b.a,b.b],[b.b,b.a]].forEach(([F,O])=>{const n=zt(O),k=(e.id||"")+F.id,pv=PREV[k];F.dmg=n;F.has=O.stats.length>0;F.flash={};if(pv)for(const z in n)if(n[z]>pv[z])F.flash[z]=1;PREV[k]=n})}))}
async function load(){
 try{const d0=new Date(Date.now()-864e5),d1=new Date(Date.now()+150*864e5);
  const j=await (await fetch(`${BASE}?dates=${ymd(d0)}-${ymd(d1)}&limit=200`)).json();
  EV=parse(j);calcDmg();LS.s("fn_cache",EV);$("#st").textContent="Updated "+new Date().toLocaleTimeString()
 }catch(e){EV=LS.g("fn_cache",[]);$("#st").textContent="Offline — showing last saved card"}
 pick();await enrich();render()}
function pick(){if(!EV.length){cur=null;return}let e=EV.find(x=>x.id==evId);
 if(!e){const now=Date.now();e=EV.find(x=>x.bouts.some(b=>b.state==="in"))||EV.find(x=>x.bouts.some(b=>b.state==="pre"))||EV[EV.length-1]}
 cur=e;const sel=$("#evSel");sel.innerHTML=EV.map(x=>`<option value="${x.id}" ${x.id==e.id?"selected":""}>${x.name} · ${new Date(x.date).toLocaleDateString()}</option>`).join("")}
function list(){if(!cur)return[];const l=[...cur.bouts].sort((a,b)=>new Date(a.date)-new Date(b.date)||0);return rev?l.reverse():l}
async function enrich(){if(!cur)return;const ids=[];list().forEach(b=>[b.a,b.b].forEach(f=>{if(f.id&&!ATH[f.id])ids.push(f.id)}));
 await Promise.all(ids.slice(0,40).map(async id=>{try{const j=await (await fetch(`https://sports.core.api.espn.com/v2/sports/mma/leagues/ufc/athletes/${id}?lang=en&region=us`)).json();
  ATH[id]={age:j.age,ht:j.displayHeight,reach:j.displayReach||(j.reach?j.reach+'"':undefined),stance:j.stance?.text}}catch(e){}}));
 LS.s("fn_ath",ATH);cur.bouts.forEach(b=>[b.a,b.b].forEach(f=>{const x=ATH[f.id]||{};Object.assign(f,{age:x.age,ht:x.ht,reach:x.reach,stance:x.stance})}))}
const flagH=f=>f.flag?`<img src="${f.flag}" onerror="this.remove()" alt="">`:"";
const ph=(f,s)=>`<img src="${f.img||sil(s==="a"?"#e0262f":"#2a6df4")}" onerror="this.onerror=null;this.src='${f.alt||sil(s==="a"?"#e0262f":"#2a6df4")}'" alt="">`;
function silH(f,s){const d=f.dmg||{head:0,body:0,leg:0},fl=f.flash||{};const sh={head:'<ellipse cx="60" cy="34" rx="22" ry="26"/>',body:'<path d="M28 70h64l10 8 6 70-14 4-6-40-4 62H36l-4-62-6 40-14-4 6-70z"/>',leg:'<path d="M36 170h48l6 120H66l-6-80-6 80H30z"/>'};
 const base=Object.values(sh).join(""),ov=Object.keys(sh).map(k=>`<g class="z ${fl[k]?"hit":""}" style="--o:${Math.min(.85,d[k]*.07)}">${sh[k]}</g>`).join("");
 return`<div class="silwrap"><svg viewBox="0 0 120 300" class="silsvg"><g fill="#ffffff1c" stroke="${s==="a"?"#e0262f":"#2a6df4"}" stroke-width="2">${base}</g>${ov}</svg><small>${f.has?`HEAD ${d.head} · BODY ${d.body} · LEG ${d.leg}`:"AWAITING STRIKE DATA…"}</small></div>`}
function fh(f,s,cls="",live=false){return`<div class="fighter ${s} ${cls}"><div class="ph">${f.flag?`<div class="fbg" style="background-image:url(${f.flag})"></div>`:""}${live&&showSil?silH(f,s):ph(f,s)}</div><div class="nm"><b>${f.name}</b><i><span class="fl">${flagH(f)}</span> ${f.cc}</i></div></div>`}
function sh(b){const r=(k,l)=>`<div class="row"><div>${b.a[k]??"-"}</div><span>${l}</span><div>${b.b[k]??"-"}</div></div>`;return`<div class="stats">${r("rec","Record")}${r("age","Age")}${r("ht","Height")}${r("reach","Reach")}${r("stance","Stance")}</div>`}
function tape(b,top,mid,ca="",cb="",live=false){return`<div class="slide"><div class="tag">${top}</div><div class="wc">${b.wc}</div>${mid||""}<div class="tape">${fh(b.a,"a",ca,live)}${sh(b)}${fh(b.b,"b",cb,live)}</div></div>`}
function listSlide(card,all){return`<div class="slide"><div class="tag">${cur.name}</div><div class="wc">${card}</div><div class="list">`+all.filter(b=>b.card===card).map(b=>`<div class="bt"><div class="s">${ph(b.a,"a")}<div>${b.a.name}<small>${flagH(b.a)} ${b.a.rec}</small></div></div><div class="m"><b>VS</b>${b.wc}</div><div class="s">${ph(b.b,"b")}<div>${b.b.name}<small>${flagH(b.b)} ${b.b.rec}</small></div></div></div>`).join("")+`</div></div>`}
function weekSlides(){const all=list(),cards=[...new Set(all.map(b=>b.card))];return[...cards.map(c=>listSlide(c,all)),...all.map((b,i)=>tape(b,`${b.card} · Bout ${i+1} of ${all.length}`))]}
function isNight(){if(mode==="night")return true;if(mode==="week")return false;return cur&&cur.bouts.some(b=>b.state==="in"||b.state==="post"||b.done)}
function autoIdx(){const all=list();let i=all.findIndex(b=>b.state==="in");if(i<0){let k=-1;all.forEach((b,j)=>{if(b.state==="post"||b.done)k=j});i=k<0?0:k}return i}
function nightView(){const all=list(),i=bro!=null?Math.max(0,Math.min(all.length-1,bro)):autoIdx(),b=all[i],nx=all[i+1],top=`${b.card} · Bout ${i+1} of ${all.length}`;
 if(b.state==="in")return tape(b,top,`<div class="live"><span class="pill">● LIVE</span><span class="rd">ROUND ${b.rd} / ${b.rounds}</span><span class="clock">${b.clock}</span></div>`,"","",true);
 if(b.state==="post"||b.done){const w=b.a.win?b.a:b.b.win?b.b:null;
  const txt=(w?`${last(w.name)} WINS`:"DRAW / NO CONTEST")+` · ${b.method} · R${b.rd} ${b.clock}`;
  return tape(b,top,`<div class="banner">${txt}</div>`+(nx?`<div class="next">NEXT: <b>${nx.a.name}</b> vs <b>${nx.b.name}</b></div>`:`<div class="next">That's a wrap!</div>`),b.a.win?"win":w?"lose":"",b.b.win?"win":w?"lose":"")}
 return tape(b,top,`<div class="next">NEXT: <b>${b.a.name}</b> vs <b>${b.b.name}</b></div>`)}
function render(){const m=$("#main");$("#sub").textContent=cur?cur.name:"";
 document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("on",x.dataset.m===mode));
 if(!cur){m.innerHTML=`<div class="slide"><div class="wc">No upcoming UFC events found</div><div class="tag">${$("#st").textContent}</div></div>`;return}
 if(isNight()){m.innerHTML=nightView();return}
 const s=weekSlides();slide%=s.length;m.innerHTML=s[slide]}
setInterval(()=>{if(!isNight()&&Date.now()-lastTouch>30000){slide++;render()}},9000);setInterval(()=>{if(bro!=null&&Date.now()-lastTouch>45000){bro=null;render()}},5000);
(function tick(){setTimeout(async()=>{await load();tick()},cur&&cur.bouts.some(b=>b.state==="in")?8000:60000)})();
$("#modeSeg").onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;LS.s("fn_mode",mode);render()}};
$("#gear").onclick=()=>{$("#info").textContent=cur?`${cur.bouts.length} bouts · mode: ${mode}`:"";$("#panel").classList.add("show")};
$("#close").onclick=()=>$("#panel").classList.remove("show");
$("#evSel").onchange=e=>{evId=e.target.value;LS.s("fn_ev",evId);load()};
$("#rev").onclick=()=>{rev=!rev;LS.s("fn_rev",rev);render()};
$("#refresh").onclick=load;
$("#fs").onclick=()=>{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e);try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(x){}};
function nav(d){lastTouch=Date.now();if(isNight()){const n=list().length,base=bro!=null?bro:autoIdx();bro=Math.max(0,Math.min(n-1,base+d))}else{const n=weekSlides().length;slide=(slide+d+n)%n}render()}
const mn=$("#main");mn.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
mn.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)nav(dx>0?1:-1)},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nav(1);if(e.key==="ArrowLeft")nav(-1)});
$("#silBtn").onclick=()=>{showSil=!showSil;LS.s("fn_sil",showSil);$("#silBtn").textContent="Silhouette: "+(showSil?"On":"Off");render()};$("#silBtn").textContent="Silhouette: "+(showSil?"On":"Off");
$("#cardsBtn").onclick=()=>{$("#evList").innerHTML=EV.map(e=>`<button class="btn evb" data-id="${e.id}">${e.name}<br><small>${new Date(e.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})} · ${e.bouts.length} bouts</small></button>`).join("")||"No events found";$("#evPanel").classList.add("show")};
$("#evList").onclick=e=>{const b=e.target.closest(".evb");if(b){evId=b.dataset.id;LS.s("fn_ev",evId);slide=0;bro=null;$("#evPanel").classList.remove("show");load()}};
$("#evClose").onclick=()=>$("#evPanel").classList.remove("show");
load();
</script></body></html>
